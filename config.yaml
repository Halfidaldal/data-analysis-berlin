# PENPAL Berlin — pipeline configuration
#
# One experiment. The shared block below is the Berlin configuration, not a
# cross-condition default: the pipeline scripts read `shared` directly and ignore
# per-experiment overrides, so anything set only under `experiments.berlin` would
# be dead config that reads as if it were in force. German models therefore live
# in `shared`, and `experiments.berlin` carries only paths and selection.

active_experiment: "berlin"

experiments:
  berlin:
    # Data paths
    raw_dir: "data/berlin/raw"
    interim_dir: "data/berlin/interim"
    processed_dir: "data/berlin/processed"

    # Interim files are written with this suffix by script 02
    # (stories_full_text_filtered_berlin.csv), so the downstream scripts must
    # append it rather than looking for the unsuffixed EMNLP filenames.
    file_suffix: "_berlin"

    # Firestore settings.
    #
    # Auth: a service-account JSON at shared.firestore.credentials_path if that
    # file exists, otherwise Application Default Credentials
    # (gcloud auth application-default login). project_id is required for the
    # ADC path -- ADC carries no project, so without it the client would use
    # whatever `gcloud config get-value project` returns.
    #
    # schema "berlin" reads the Berlin document shape (workshop_id, language,
    # client_id) and applies no completeness filter. The "flat" reader used by
    # the English conditions keeps only whole min_interactions-sized chunks,
    # which here would drop 140 of 316 conversations and lose workshop_id
    # entirely. Selection is done later and explicitly in nes.berlin_pov.
    firestore:
      collection_name: "story_data_berlin"
      stories_collection: "story_data_berlin"
      project_id: "the-never-ending-story-a7b5f"
      schema: "berlin"

      # The collection is a fixed event: Festival of Future Nows, Neue
      # Nationalgalerie, 31 Oct - 2 Nov 2025. The installation kept accepting
      # input afterwards, so a later download picks up sessions from 10 Nov to
      # 2 Dec that look legitimate (real workshop_id and language, the museum's
      # own devices) and would otherwise join the corpus. Dates are Berlin local
      # time, both ends inclusive, applied to each conversation's first turn so
      # a session running past midnight is not split.
      collection_start: "2025-10-31"
      collection_end: "2025-11-02"
      timezone: "Europe/Berlin"

    cleaning:
      # The instrument was designed to stop at five turn-pairs and mostly did.
      # 13 sessions ran to 6-10, and 12 of those are from 31 October, the first
      # full collection day (96 conversations, 12 over-length); across 1-2
      # November, 215 conversations produced one. The limit was evidently not
      # enforced on day one and was fixed afterwards -- an instrument change
      # mid-collection, not participant behaviour. The sessions themselves are
      # genuine (normal hours, both devices, both languages, all three
      # conditions, continuous sittings), so they are truncated rather than
      # dropped: every story is then comparable under the same five-turn
      # instrument, and only the part the instrument should not have allowed is
      # discarded.
      max_turns: 5

    # Author columns in raw data (before normalization to author_1 / author_2)
    raw_columns:
      author_1: "user"
      author_2: "ai"

    # The perspective conditions, carried in `workshop_id`.
    conditions:
      "1": "W1 — the narrating I is an AI reconstruction of a real person"
      "2": "W2 — the narrating I is a future language model"
      "3": "W3 — the narrating I is an object that has outlived its use"

# ---------------------------------------------------------------------------
# Shared configuration
# ---------------------------------------------------------------------------
shared:
  firestore:
    # Optional. Not committed (environment/ is gitignored); when the file is
    # absent the pipeline uses Application Default Credentials instead.
    credentials_path: "environment/the-never-ending-story-a7b5f-0f4f8dbe4084.json"

  cleaning:
    # Legacy edit-distance settings are intentionally no longer used by
    # scripts/02_clean_dataset.py. The primary pipeline uses deterministic
    # text-quality QC without rewriting participant text.
    edit_distance_threshold: 100
    text_quality_qc:
      story_exclusion_min_flagged_rows: 2
      exclude_if_first_human_flagged: true
      min_substantive_chars: 3
      min_alpha_ratio: 0.45
      max_symbol_ratio: 0.35
      max_keyboard_pattern_ratio: 0.12
      min_word_vowel_ratio: 0.35
      long_token_chars: 24
      min_word_count_for_vowel_check: 3
    simulated: false

  # Embeddings. The stories are German, so a multilingual encoder is in force;
  # the English PENPAL conditions use QZhou and are not comparable.
  #
  # F2LLM-v2-14B: 5120 dimensions, multilingual (200+ languages), plain
  # sentence-transformers, no trust_remote_code. It is a 14B model -- roughly
  # 28GB in fp16 -- so it needs a large GPU and is not CPU-feasible.
  #
  # `task` stays null: that was a jina-v3 argument. F2LLM's Instruct/Query
  # prompt format is for asymmetric retrieval; turn-to-turn similarity here is
  # symmetric, so turns are encoded plain with no instruction prefix. Adding one
  # would change what the cosine distances mean.
  embeddings:
    model_name: "codefuse-ai/F2LLM-v2-14B"
    batch_size: 1
    task: null

  # Sentiment: concept-vector projection, and only that.
  #
  # The projection encoder is multilingual, so it applies to German directly and
  # keeps the measure comparable in construction to the English conditions.
  # Turn-level and passage-level sentiment are the same numbers reshaped, not two
  # measures -- scripts/09_build_metric_tables.py never rescores text. A German
  # sentiment classifier was previously configured here as an alternative engine;
  # it is removed rather than left in place, because nothing reads it and a
  # configured-but-unused model reads as though it were in force.
  sentiment:
    batch_size: 64
    valence_method: "simple"
    engine: "projection"
    language: "de"
    axis: "valence"

    projection_model_name: "paraphrase-multilingual-mpnet-base-v2"
    projection_vector_path: "src/nes/data/Sentiment.csv"
    projection_anchor_text_path: "src/nes/data/Fiction4Sentiment_concept_text.csv"
    projection_context_window: 1
    projection_batch_size: 32
    projection_build_batch_size: 8
    projection_task: null
    projection_context_separator: "\n"

  # Spelling correction of the human side (script 02).
  #
  # Visitors typed on a touchscreen, often without capitals, and the German
  # dependency parser downstream is trained on conventionally capitalised
  # German. The correction is constrained to orthography; script 02 keeps the
  # original in author_1_raw and the Levenshtein distance in
  # author_1_edit_distance, so rewrites can be found rather than trusted.
  # Needs GEMINI_API_KEY (or GOOGLE_API_KEY) in the environment.
  spelling:
    model_name: "gemini-3.5-flash-lite"

  # Surface metrics (textdescriptives). German model: the corpus is German and
  # an English pipeline would mis-tag every sentence.
  surface_metrics:
    spacy_mdl: "de_core_news_md"
    batch_size: 10
    n_process: 5

  # Dependency parsing (scripts 06, 07). The transformer
  # parser is used rather than the md pipeline because much of the human text is
  # uncapitalised, which the smaller German models handle poorly.
  parsing:
    spacy_mdl: "de_dep_news_trf"
    spacy_mdl_en: "en_core_web_trf"

  analysis:
    random_seed: 42
    language: "de"
